<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111113">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="수빈 프리미엄 소셜링">
<title>수빈 소셜링</title>
<link rel="icon" href="data:,">
<link rel="preload" href="SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="suit.css">
<link rel="stylesheet" href="components.css?v=4">
<link rel="stylesheet" href="mobile.css?v=4">
<script defer src="lucide.min.js"></script>
<script defer src="app.js?v=4"></script>
</head>
<body><div id="subin-kit"><div class="phone product" aria-label="조합 미리보기">
<header class="phone-header"><span class="brand">subin. </span><button class="app-bell cursor-interaction" type="button" data-preset="likes" aria-label="받은 호감 알림"><i data-lucide="bell" aria-hidden="true"></i></button></header>
<div class="phone-main"><div class="phone-title"><h2>오늘의 만남을<br>기대해도 좋아요.</h2></div><div class="likes-notice" data-likes-notice hidden role="note"><i data-lucide="info" aria-hidden="true"></i><span>호감을 수락하면 서로의 연락처가 공개돼요.</span></div><div data-composition></div></div>
<nav class="phone-nav" aria-label="앱 메뉴"><button type="button" class="cursor-interaction" data-preset="home" aria-pressed="true"><i data-lucide="house" aria-hidden="true"></i>홈</button><button type="button" class="cursor-interaction" data-preset="live" aria-pressed="false"><i data-lucide="armchair" aria-hidden="true"></i>내 행사</button><button type="button" class="cursor-interaction" data-preset="likes" aria-pressed="false"><i data-lucide="heart" aria-hidden="true"></i>호감</button><button type="button" class="cursor-interaction" data-preset="my" aria-pressed="false"><i data-lucide="user-round" aria-hidden="true"></i>마이</button></nav>
</div>
<template data-component="event"><article class="piece event-shell"><button type="button" class="piece event cursor-interaction" data-action="event" aria-label="성수 프라이빗 공간 · 11월 14일 토요일 오후 6시 · 최대 36명, 행사 자세히 보기"><span class="event-media" style="display:block"><img data-venue-image src="venue-example.jpg" alt="통창과 따뜻한 조명이 있는 라운지"></span><span class="event-bottom" style="display:block"><span class="row"><span><span class="event-title">성수 프라이빗 공간</span><span class="event-meta">11.14(토) · 오후 6시 · 최대 36명</span></span><i class="icon" data-lucide="chevron-right" aria-hidden="true"></i></span><span class="feedback" style="display:block" aria-live="polite"></span></span></button><div class="event-apply"><a class="apply-link" href="https://docs.google.com/forms/d/e/1FAIpQLSeB535XoFtMke_ivBZcahkKOMT7X1iDJU7i1XEDiHGp66ZGcg/viewform" target="_blank" rel="noopener noreferrer">참가 신청하기</a></div></article></template>
<template data-component="profile"><article class="piece profile" aria-label="참가자 프로필"><div class="profile-row"><details><summary class="cursor-interaction" aria-label="서연님 프로필 펼치기"><span class="name">서연 <span class="sub">28</span><i data-lucide="badge-check" aria-label="직업 인증"></i></span><p class="profile-meta">약사 · 서울 · INFJ</p></summary><p class="profile-intro">익숙한 길을 걷다가도 새로운 카페를 발견하면 기분이 좋아져요.</p></details><button type="button" class="heart-button cursor-interaction" data-action="heart" aria-label="서연님에게 호감 보내기"><i data-lucide="heart" aria-hidden="true"></i></button></div><div class="feedback" aria-live="polite"></div></article></template>
<template data-component="timer"><article class="piece pad timer" aria-label="현재 라운드와 남은 시간"><h3>첫인상은 어땠나요?</h3><div class="row"><span class="round">3 / 6 라운드</span><span class="chip">대화 중</span></div><div class="time" aria-label="남은 시간 12분 48초">12:48</div><div class="track" aria-hidden="true"><div></div></div><div class="row"><span class="sub">현재 <span style="color:var(--s-text)">3번 테이블</span></span><span class="sub">다음 <span style="color:var(--s-text)">4번 →</span></span></div></article></template>
<template data-component="seats"><article class="piece pad seats" aria-label="테이블 배치도"><div class="row"><h3 style="font-size:20px">오늘 소셜링 자리</h3><span class="micro">남성 이동</span></div><div class="seat-grid" aria-label="테이블 위치 확인"><button type="button" class="cursor-interaction" aria-label="1번 테이블 확인" aria-pressed="false" data-table="1">01</button><button type="button" class="cursor-interaction" aria-label="2번 테이블 확인" aria-pressed="false" data-table="2">02</button><button type="button" class="cursor-interaction" aria-label="3번 테이블 확인, 현재 내 자리" aria-pressed="true" data-table="3">03</button><button type="button" class="cursor-interaction" aria-label="4번 테이블 확인, 다음 이동 자리" aria-pressed="false" data-table="4">04</button><button type="button" class="cursor-interaction" aria-label="5번 테이블 확인" aria-pressed="false" data-table="5">05</button><button type="button" class="cursor-interaction" aria-label="6번 테이블 확인" aria-pressed="false" data-table="6">06</button></div><div class="table-details" aria-live="polite"><div class="row"><span>3번 테이블</span><span class="sub">현재 내 자리</span></div><p class="sub" style="margin-top:6px">다음 라운드에는 4번으로 이동해요.</p></div></article></template>
<template data-component="like"><article class="piece like" aria-label="받은 호감"><div class="row"><div class="like-heading"><i data-lucide="heart" aria-hidden="true"></i><h3>서연님이 보낸 호감</h3></div><span class="micro">방금 전</span></div><p class="sub like-info">28세 · 약사 · INFJ · 3번 테이블</p><div class="like-actions"><button type="button" class="action cursor-interaction" data-action="accept">수락하기</button><button type="button" class="ghost cursor-interaction" data-action="reject">거절하기</button></div><div class="feedback" aria-live="polite"></div></article></template>
<template data-component="concierge"><article class="piece pad concierge" aria-label="1대1 프리미엄 매칭" data-motion="playing"><div class="matching-scene" role="img" aria-label="남녀의 원형 프로필 사이로 빛이 이동하고 하트가 나타나는 매칭 애니메이션"><div class="matching-avatar man"><img data-couple-image src="matching-models.jpg" alt="남성 프로필 이미지"></div><div class="matching-wire" aria-hidden="true"><span class="matching-signal"></span><span class="matching-heart"><i data-lucide="heart"></i></span></div><div class="matching-avatar woman"><img data-couple-image src="matching-models.jpg" alt="여성 프로필 이미지"></div></div><h3>많은 만남보다,<br>나에게 맞는 한 사람.</h3><p class="sub">취향과 가치관을 살펴<br>매니저가 신중하게 제안해 드려요.</p><button type="button" class="matching-button cursor-interaction" data-action="consult"><span>1:1 매칭 알아보기</span></button><div class="feedback" aria-live="polite"></div></article></template>
<template data-app-template="my"><section class="profile-summary"><h3>민준 <span class="sub">32</span></h3><p class="sub">대기업 재직 · 서울 · ENTP</p><span class="chip"><i data-lucide="badge-check" aria-hidden="true"></i>직업 인증 완료</span></section><ul class="app-list"><li><span>내 프로필</span><button class="ghost cursor-interaction" type="button" data-route="register">수정하기</button></li><li><span>참가 예정 행사</span><button class="ghost cursor-interaction" type="button" data-preset="live">성수 소셜링</button></li><li><span>1:1 매칭</span><button class="ghost cursor-interaction" type="button" data-route="premium">서비스 보기</button></li><li><span>프로필 공개</span><span>행사 참가자 한정</span></li></ul></template>
<template data-app-template="eventDetails"><ul class="app-list"><li><span>일정</span><span>11월 14일(토) · 오후 6시</span></li><li><span>장소</span><span>성수 프라이빗 공간</span></li><li><span>규모</span><span>최대 36명 · 6개 테이블</span></li><li><span>드레스코드</span><span>블랙 & 화이트</span></li></ul><p class="detail-note">상세 위치는 참가자에게 별도로 안내해요.</p><a class="apply-link detail-cta" href="https://docs.google.com/forms/d/e/1FAIpQLSeB535XoFtMke_ivBZcahkKOMT7X1iDJU7i1XEDiHGp66ZGcg/viewform" target="_blank" rel="noopener noreferrer">참가 신청하기</a></template>
<template data-app-template="premiumDetails"><ul class="app-list"><li><span>프로필 등록</span><span>기본 정보와 선호 조건 작성</span></li><li><span>매니저 추천</span><span>어울리는 상대를 개별 제안</span></li><li><span>쌍방 동의</span><span>서로 확인한 뒤 연결</span></li></ul><p class="detail-note">프로필 등록은 무료예요. 매칭 조건과 비용은 추천·연결 단계에서 안내해요. 이름과 사진은 본인의 공개 동의를 먼저 받아요.</p><button class="action detail-cta cursor-interaction" type="button" data-route="register">프로필 등록하기</button></template>
<template data-app-template="register"><form class="app-form" data-demo-form><label>이름<input name="name" value="민준" required maxlength="20" autocomplete="off"></label><label>직업<input name="job" value="대기업 재직" required maxlength="40" autocomplete="off"></label><label>나를 소개하는 한마디<textarea name="intro" maxlength="300">산책과 여행을 좋아해요. 편안하게 대화할 수 있는 분을 만나고 싶어요.</textarea></label><label>만나고 싶은 사람<textarea name="preference" maxlength="300" placeholder="중요하게 생각하는 취향과 가치관을 적어주세요."></textarea></label><button type="submit" class="action cursor-interaction">프로필 저장하기</button><div data-form-status role="status"></div></form></template>
</div></body></html>
